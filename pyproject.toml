[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cft-veracode"
version = "0.1.0"
description = "Veracode scanner findings → CFT (CWE Fix Technique) remediation plans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cashiuus", email = "cashiuus@gmail.com" }
]
keywords = ["security", "veracode", "sast", "cwe", "cft", "remediation", "appsec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cft-resolver>=0.1.0",
    "requests>=2.28",
    "veracode-api-signing>=18.6.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.23"]

[project.scripts]
cft-veracode = "cft_veracode.cli:main"

[project.urls]
Homepage = "https://github.com/Cashiuus/cft-veracode"
Taxonomy = "https://github.com/Cashiuus/cft-taxonomy"
Resolver = "https://github.com/Cashiuus/cft-resolver"

[tool.setuptools.packages.find]
where = ["src"]
